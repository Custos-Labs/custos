name: CI
on:
  push:
    branches:
      - main
  pull_request: null
permissions:
  contents: read
jobs:
  ci:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: verixa
          POSTGRES_PASSWORD: verixa
          POSTGRES_DB: verixa_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U verixa -d verixa_test" --health-interval
          5s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout
          5s --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa_test
      DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa_test
      REQUIRE_DATABASE_TESTS: "1"
      TEST_REDIS_URL: redis://localhost:6379
      REQUIRE_REDIS_TESTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build
        run: pnpm build
      - name: Re-link workspace packages
        run: pnpm install --frozen-lockfile
      - name: Verify migrations apply to a fresh database
        run: pnpm db:migrate:deploy
      - name: Validate Prisma schema
        run: pnpm --filter @verixa/database run db:validate
      - name: Check Prisma schema formatting
        run: pnpm --filter @verixa/database run db:format:check
      - name: Check for schema/migration drift
        env:
          SHADOW_DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa_shadow
        run: 'PGPASSWORD=verixa psql -h localhost -U verixa -d postgres -c "DROP DATABASE
          IF EXISTS verixa_shadow;"

          PGPASSWORD=verixa psql -h localhost -U verixa -d postgres -c "CREATE DATABASE
          verixa_shadow;"

          pnpm --filter @verixa/database run db:drift

          '
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Identity coverage gate
        run: pnpm --filter @verixa/identity run test:coverage
      - name: Credentials coverage gate
        run: pnpm --filter @verixa/credentials run test:coverage
      - name: Audit coverage gate
        run: pnpm --filter @verixa/audit run test:coverage
  testcontainers:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      REQUIRE_DATABASE_TESTS: "1"
      DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa_placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm db:generate
      - name: Build
        run: pnpm build
      - name: Re-link workspace packages
        run: pnpm install --frozen-lockfile
      - name: Run identity repository contract tests against Testcontainers Postgres
        run: pnpm --filter @verixa/identity run test
      - name: Run authorization repository contract tests against Testcontainers Postgres
        run: pnpm --filter @verixa/authorization run test
  compose-database-roles:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://verixa:verixa@localhost:5432/verixa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - name: Start Postgres from docker-compose.yml
        run: docker compose up -d --wait postgres
      - name: Confirm compose points the API at the unprivileged role
        run: "set -eu\ndocker compose config --format json > compose.resolved.json\n\
          url=\"$(python3 -c \"import json; print(json.load(open('compose.resolved.json'))['services']['api']['environment']['DATABASE_URL'])\"\
          )\"\necho \"api DATABASE_URL: $url\"\ncase \"$url\" in\n  postgres://verixa_app:*)\
          \ ;;\n  *)\n    echo \"::error::the api service must connect as verixa_app,\
          \ not as the superuser\"\n    exit 1\n    ;;\nesac\n"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate the Prisma client
        run: pnpm --filter @verixa/database run db:generate
      - name: Apply migrations as the owner
        run: pnpm --filter @verixa/database run db:migrate:deploy
      - name: The app role exists and is unprivileged
        run: "set -eu\nattrs=\"$(docker compose exec -T postgres psql -U verixa -d verixa\
          \ -tAX -c \"SELECT rolsuper, rolbypassrls, rolcreatedb, rolcreaterole FROM\
          \ pg_roles WHERE rolname = 'verixa_app'\")\"\necho \"verixa_app (super|bypassrls|createdb|createrole):\
          \ $attrs\"\nif [ -z \"$attrs\" ]; then\n  echo \"::error::verixa_app was not\
          \ created — did the init script run?\"\n  exit 1\nfi\nif [ \"$attrs\" != \"\
          f|f|f|f\" ]; then\n  echo \"::error::verixa_app must be NOSUPERUSER NOBYPASSRLS\
          \ NOCREATEDB NOCREATEROLE\"\n  exit 1\nfi\n"
      - name: The app role can read and write application tables
        run: 'set -eu

          docker compose exec -T postgres psql -U verixa_app -d verixa -v ON_ERROR_STOP=1
          -c "INSERT INTO users (id, email, display_name, status, created_at, updated_at)
          VALUES (gen_random_uuid(), ''role-check@example.com'', ''Role Check'', ''active'',
          now(), now());"

          docker compose exec -T postgres psql -U verixa_app -d verixa -v ON_ERROR_STOP=1
          -c "SELECT count(*) FROM users;"

          '
      - name: The app role is subject to row level security
        run: "set -eu\nif docker compose exec -T postgres psql -U verixa_app -d verixa\
          \ -v ON_ERROR_STOP=1 -c \"INSERT INTO organizations (id, name, slug, owner_id,\
          \ status, created_at, updated_at) SELECT gen_random_uuid(), 'Bypass Check',\
          \ 'bypass-check', id, 'active', now(), now() FROM users LIMIT 1;\"; then\n\
          \  echo \"::error::verixa_app bypassed row level security — tenant isolation\
          \ is not enforced\"\n  exit 1\nfi\necho \"insert refused by row level security,\
          \ as required\"\n"
      - name: The app role cannot issue DDL
        run: "set -eu\nif docker compose exec -T postgres psql -U verixa_app -d verixa\
          \ -v ON_ERROR_STOP=1 -c \"CREATE TABLE should_not_exist (id uuid PRIMARY KEY);\"\
          ; then\n  echo \"::error::verixa_app must not be able to create tables\"\n\
          \  exit 1\nfi\necho \"DDL refused, as required\"\n"
      - name: Stop the stack
        if: always()
        run: docker compose down -v || true
  docker:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build image
        run: docker build -f apps/api/Dockerfile -t verixa-api:ci .
      - name: Run container
        run: "docker run -d --name verixa-api -p 3000:3000 \\\n  -e SESSION_ACCESS_TOKEN_SECRET=\"\
          ci-smoke-test-secret-at-least-32-characters\" \\\n  verixa-api:ci\n"
      - name: Wait for /health
        run: "for _ in $(seq 1 20); do\n  if curl -sf http://localhost:3000/health;\
          \ then\n    exit 0\n  fi\n  sleep 1\ndone\necho \"::error::verixa-api did\
          \ not become healthy in time\"\ndocker logs verixa-api\nexit 1\n"
      - name: Verify the container does not run as root
        run: "user=\"$(docker exec verixa-api whoami)\"\necho \"Container user: $user\"\
          \nif [ \"$user\" = \"root\" ]; then\n  echo \"::error::apps/api container\
          \ must not run as root\"\n  exit 1\nfi\n"
      - name: Stop container
        if: always()
        run: docker rm -f verixa-api || true
