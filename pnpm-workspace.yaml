packages:
  - "apps/*"
  - "packages/*"
  - "tests"
# Copies workspace dependencies' real files into node_modules instead of
# symlinking them — required for `pnpm deploy` (used to build the apps/api
# Docker image, Issue 012) to produce a self-contained, node_modules-portable
# bundle instead of one full of symlinks back into the monorepo.
injectWorkspacePackages: true
# Prisma's install scripts download the platform-specific query engine
# binaries it needs to run at all, and @prisma/client's postinstall runs
# `prisma generate`. Both are required for Prisma to function, so they're
# allowed here rather than left blocked (pnpm blocks all install scripts by
# default — a good default, since an install script is arbitrary code
# execution from a dependency; each entry here is a deliberate exception).
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
  # Transitive deps of @testcontainers/postgresql (Issue 047), all denied.
  # cpu-features and ssh2 matter only for Docker-over-SSH connections, and we
  # connect over the local socket; protobufjs's build step precompiles
  # definitions it also resolves fine at runtime. Recorded explicitly so
  # `pnpm install` doesn't stop to ask and the decision isn't re-litigated.
  cpu-features: false
  protobufjs: false
  ssh2: false
# fast-uri is a transitive dependency (via fastify's ajv-compiler chain and
# commitlint's ajv chain), pulled in at vulnerable version ranges in some of
# those paths (GHSA-8jxf-...: host confusion via a backslash authority
# introducer). Neither is a direct dependency, so the fix has to be an
# override; pinning to a single known-patched version (rather than a
# range-conditional override per vulnerable range) is simpler and equally
# effective here since nothing in this repo depends on fast-uri's API
# directly across a major version boundary.
overrides:
  fast-uri: ">=4.1.2"
  # nanoid <3.3.18: a custom generator with size 0 loops forever (GHSA,
  # high). Transitive via the vitest/postcss chain, so an override is the
  # only lever.
  # Constrained to the 3.x line, not a bare ">=": an unbounded override
  # resolved this to 6.x, and silently major-bumping a transitive dependency
  # to fix a patch-level CVE trades a known bug for an unknown one.
  nanoid: "^3.3.18"
  # qs <6.16.0: denial of service via an attacker-controlled isBuffer.
  # Transitive via the supertest/superagent chain used in integration tests.
  qs: ">=6.16.0"
  # axios <1.20.0: multiple SSRF advisories (absolute-URL base-URL bypass,
  # unenforced maxRedirects on the fetch adapter). Transitive via
  # @stellar/stellar-sdk, used by packages/audit, packages/stellar-anchor
  # and apps/api. Constrained to the 1.x line for the same reason as nanoid
  # above.
  axios: "^1.20.0"
  # deepmerge-ts <8.0.0: stack exhaustion merging recursive object graphs.
  # Transitive via prisma's own @prisma/config dependency (build-time CLI
  # tooling, not shipped to production), so an override is the only lever.
  deepmerge-ts: ">=8.0.0"
  # vite <=6.4.2: server.fs.deny bypass via a Windows alternate-data-stream
  # path. Transitive via vitest's own vite dependency; vitest 3.2.6+ accepts
  # vite ^5 || ^6, and pnpm was resolving the ^5 branch, which this advisory
  # also covers. Constrained to the 6.x line, not a bare ">=": an unbounded
  # override resolved this to 8.x, same reasoning as nanoid above.
  vite: "^6.4.3"
  # tinypool <2.1.2: prototype-pollution gadget in worker/run() options
  # leading to RCE (two advisories, both closed at 2.1.2). Transitive via
  # vitest's own worker-pool dependency.
  tinypool: "^2.1.2"
