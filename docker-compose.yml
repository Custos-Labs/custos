# Local development stack: apps/api + Postgres + Redis, with source mounted
# for hot-reload. This is deliberately NOT built from apps/api/Dockerfile —
# that image is a slim, non-root *production* artifact with no source and no
# dev tooling, which makes hot-reload impossible. Dev and prod share the same
# base image and package manager, but not the same container shape; see
# docs/guides/docker.md for why that's still "dev/prod parity" and not a
# contradiction of it.
#
# Services and current roles:
# - postgres: Backs the persistence layer, running Prisma migrations and RLS
#   policies with dual databases (`verixa` for dev, `verixa_test` for test
#   runs) and the unprivileged `verixa_app` role used by apps/api repositories.
# - redis: Provisioned for distributed session and cache storage, but
#   currently unused by active application code because packages/sessions is
#   quarantined (see docs/QUARANTINE.md).
# - apps/api: The Fastify HTTP API container wired to the database via
#   @verixa/config and Prisma client.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: verixa
      POSTGRES_PASSWORD: verixa
      POSTGRES_DB: verixa
    ports:
      - "5432:5432"
    volumes:
      - verixa-postgres-data:/var/lib/postgresql/data
      # Run in filename order on first start only (empty data directory).
      # 01 provisions a second `verixa_test` database, isolated from the
      # `verixa` dev database above — see docs/guides/database.md for why
      # tests need their own. 02 creates the unprivileged `verixa_app` role
      # the API connects as, and depends on `verixa_test` already existing.
      - ./infra/postgres/01-init-test-db.sh:/docker-entrypoint-initdb.d/01-init-test-db.sh:ro
      - ./infra/postgres/02-init-app-role.sh:/docker-entrypoint-initdb.d/02-init-app-role.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verixa -d verixa"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - verixa-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: node:22-alpine
    working_dir: /repo
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm --filter @verixa/api^... run build &&
             pnpm --filter @verixa/api run dev"
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # Connects as `verixa_app`, not as the `verixa` superuser.
      #
      # PostgreSQL superusers bypass row level security completely, so an API
      # connected as one would have every tenant-isolation policy silently
      # skipped — and a bug that forgot to set `app.current_organization_id`
      # would read across tenants with no test failing. Migrations still run
      # as `verixa` (see .env / DATABASE_URL on the host), because DDL needs
      # the owner. See infra/postgres/02-init-app-role.sh.
      DATABASE_URL: postgres://verixa_app:verixa_app@postgres:5432/verixa
      REDIS_URL: redis://redis:6379
      SESSION_ACCESS_TOKEN_SECRET: ${SESSION_ACCESS_TOKEN_SECRET:-dev-insecure-session-secret-min-32-chars-long}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
    volumes:
      - .:/repo
      # Named volumes for every node_modules directory in the workspace:
      # node_modules must not be the host bind mount (Linux-built native
      # binaries like esbuild are not portable to/from a Windows or macOS
      # host, and bind-mounted node_modules I/O is painfully slow on both).
      - verixa-node-modules:/repo/node_modules
      - verixa-api-node-modules:/repo/apps/api/node_modules
      - verixa-config-node-modules:/repo/packages/config/node_modules
      - verixa-credentials-node-modules:/repo/packages/credentials/node_modules
      - verixa-database-node-modules:/repo/packages/database/node_modules
      - verixa-identity-node-modules:/repo/packages/identity/node_modules
      - verixa-shared-kernel-node-modules:/repo/packages/shared-kernel/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  verixa-postgres-data:
  verixa-redis-data:
  verixa-node-modules:
  verixa-api-node-modules:
  verixa-config-node-modules:
  verixa-credentials-node-modules:
  verixa-database-node-modules:
  verixa-identity-node-modules:
  verixa-shared-kernel-node-modules:
